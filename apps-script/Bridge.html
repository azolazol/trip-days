<!doctype html><html><head><meta charset="utf-8"></head><body><script>
const allowedOrigin=<?!= JSON.stringify(origin) ?>,channel=<?!= JSON.stringify(channel) ?>;
window.addEventListener('message',e=>{if(e.source!==window.top||e.origin!==allowedOrigin)return;const d=e.data;if(!d||d.type!=='trip-request'||d.channel!==channel)return;google.script.run.withSuccessHandler(result=>window.top.postMessage({channel,id:d.id,...(result.error?{error:result.error}:{result})},allowedOrigin)).withFailureHandler(()=>window.top.postMessage({channel,id:d.id,error:'저장소 응답을 받지 못했어요.'},allowedOrigin)).api(d.payload)});
window.top.postMessage({type:'trip-ready',channel},allowedOrigin);
</script></body></html>
